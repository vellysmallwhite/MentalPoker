name: mental-poker-legacy

x-player: &player
  image: mental-poker-legacy-player:${LEGACY_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile.client
    args:
      CMAKE_PRESET: ${LEGACY_CMAKE_PRESET:-ci-release}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m
  environment: &player-environment
    NODE_TYPE: client
    SERVER_HOST: poker-server.local
    ASAN_OPTIONS: ${LEGACY_ASAN_OPTIONS:-detect_leaks=1:halt_on_error=1}
    UBSAN_OPTIONS: ${LEGACY_UBSAN_OPTIONS:-halt_on_error=1:print_stacktrace=1}
  depends_on:
    server:
      condition: service_healthy
  stop_grace_period: 2s
  networks:
    - poker_network

services:
  server:
    image: mental-poker-legacy-lobby:${LEGACY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.server
    hostname: poker-server.local
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      NODE_TYPE: server
      NODE_ID: server
      HOSTNAME: poker-server.local
      PYTHONUNBUFFERED: "1"
    ports:
      - "${LEGACY_SERVER_PORT:-8080}:8080"
    stop_grace_period: 2s
    networks:
      poker_network:
        aliases:
          - poker-server.local

  player1:
    <<: *player
    hostname: player1
    environment:
      <<: *player-environment
      NODE_ID: player1.local
      HOSTNAME: player1.local
    networks:
      poker_network:
        aliases:
          - player1.local

  player2:
    <<: *player
    hostname: player2
    environment:
      <<: *player-environment
      NODE_ID: player2.local
      HOSTNAME: player2.local
    networks:
      poker_network:
        aliases:
          - player2.local

  player3:
    <<: *player
    hostname: player3
    environment:
      <<: *player-environment
      NODE_ID: player3.local
      HOSTNAME: player3.local
    networks:
      poker_network:
        aliases:
          - player3.local

  player4:
    <<: *player
    hostname: player4
    environment:
      <<: *player-environment
      NODE_ID: player4.local
      HOSTNAME: player4.local
    networks:
      poker_network:
        aliases:
          - player4.local

networks:
  poker_network:
    driver: bridge
